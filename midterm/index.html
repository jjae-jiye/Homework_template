<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>손자국</title>
<meta name="theme-color" content="#f6f2ec">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Nanum+Myeongjo:wght@700;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">

  <!-- 작업 화면: 점토 하나를 만지는 곳 -->
  <section class="view" id="work" aria-label="점토 작업">
    <div id="stage">
      <canvas id="gl"></canvas>
      <canvas id="fx"></canvas>
    </div>
    <header class="work-top">
      <button class="home-btn" id="home-btn" type="button">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><circle cx="10" cy="10" r="8"/><circle cx="10" cy="10" r="4.6"/><circle cx="10" cy="10" r="1.3" fill="currentColor" stroke="none"/></svg>
        <span>물레</span>
      </button>
    </header>
    <footer class="specimen">
      <p class="hint" id="hint"></p>
      <p class="label" id="label"></p>
    </footer>
  </section>

  <!-- 홈: 점토들이 놓인 물레 -->
  <section class="view off" id="home" aria-label="물레">
    <header class="home-head">
      <div></div>
      <span class="count" id="count"></span>
    </header>
    <div class="wheel-wrap">
      <canvas id="wheel" role="img" aria-label="물레 진열장. 판을 돌려 지난 점토를 찾고, 점토를 톡 치면 열려요"></canvas>
      <p class="wheel-info" id="wheel-info" aria-live="polite" hidden></p>
    </div>
    <p class="dough-cap">흙을 위로 끌어 새 점토 떼어내기</p>
    <div class="dough" id="dough" role="button" tabindex="0" aria-label="흙에서 새 점토 떼어내기"><canvas id="dough-cv"></canvas></div>
  </section>

</main>

<canvas id="piece" aria-hidden="true"></canvas>
<span class="demo-tag" id="demo-tag" hidden>시연 모드 · 1분이 하루</span>
<div class="toast" id="toast" role="status" aria-live="polite"><span id="toast-msg"></span><button id="toast-act" type="button" hidden></button></div>
<div class="fallback" id="fallback" hidden><p>이 브라우저에서는 점토를 그릴 수 없어요.<br>크롬이나 사파리 최신 버전에서 열어주세요.</p></div>

<script src="script.js"></script>
</body>
</html>
